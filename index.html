<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b4b">
<link rel="icon" href="icon-192.png">
<title>Daily Inspiration — 6:30</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e1b4b, #0f0c29 70%);
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    color: #fff;
    text-align: center;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,139,250,0.35), transparent 70%);
    filter: blur(10px);
    animation: pulse 4s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  .content { position: relative; z-index: 1; max-width: 420px; }
  h1 {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 20px;
    font-weight: 600;
  }
  #quote {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 14px;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  #author {
    font-size: 14px;
    color: #cbd5e1;
    opacity: 0.8;
    margin-bottom: 34px;
  }
  button {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 16px 36px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(139,92,246,0.45);
  }
  button:active { transform: scale(0.96); }
  #status {
    margin-top: 22px;
    font-size: 12px;
    color: #766fa3;
  }
  #timer {
    margin-top: 6px;
    font-size: 13px;
    color: #a78bfa;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="content">
  <h1>✨ Morning Inspiration</h1>
  <div id="quote">Tap begin to start your 6:30 moment</div>
  <div id="author"></div>
  <button id="startBtn">Begin</button>
  <div id="status"></div>
  <div id="timer"></div>
</div>

<script>
const quotes = [
  { text: "The best way to predict the future is to create it.", author: "Abraham Lincoln" },
  { text: "What you do today can improve all your tomorrows.", author: "Ralph Marston" },
  { text: "Discipline is choosing between what you want now and what you want most.", author: "Abraham Lincoln" },
  { text: "Small daily improvements are the key to staggering long-term results.", author: "unknown" },
  { text: "You do not rise to the level of your goals, you fall to the level of your systems.", author: "James Clear" },
  { text: "The obstacle in the path becomes the path. Never forget, within every obstacle is an opportunity to improve our condition.", author: "Ryan Holiday" },
  { text: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe" },
  { text: "Energy and persistence conquer all things.", author: "Benjamin Franklin" },
  { text: "Your future is created by what you do today, not tomorrow.", author: "unknown" },
  { text: "A calm mind brings inner strength and self confidence.", author: "Dalai Lama" }
];

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let humNodes = [];
let running = false;
let endTime = null;
let quoteTimeout = null;
let timerInterval = null;

const quoteEl = document.getElementById('quote');
const authorEl = document.getElementById('author');
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');

function startHum() {
  ctx = new AudioCtx();
  // Layered warm hum: a few soft sine tones close together
  const freqs = [110, 165, 220];
  const masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 2);
  masterGain.connect(ctx.destination);

  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.15 + i * 0.05;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 3;
    lfo.connect(lfoGain).connect(osc.frequency);
    lfo.start();
    osc.connect(masterGain);
    osc.start();
    humNodes.push(osc, lfo);
  });
  humNodes.push(masterGain);
}

function chime() {
  if (!ctx) return;
  const notes = [880, 1108, 1318, 1760];
  let t = ctx.currentTime;
  notes.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0, t + i * 0.12);
    gain.gain.linearRampToValueAtTime(0.18, t + i * 0.12 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 1.2);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t + i * 0.12);
    osc.stop(t + i * 0.12 + 1.3);
  });
}

function stopHum() {
  humNodes.forEach(n => { try { n.stop && n.stop(); } catch(e){} });
  humNodes = [];
  if (ctx) { ctx.close(); ctx = null; }
}

let voicesReady = false;
let cachedVoices = [];

function loadVoices() {
  cachedVoices = speechSynthesis.getVoices();
  if (cachedVoices.length > 0) voicesReady = true;
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    statusEl.textContent = "This browser doesn't support spoken voice.";
    return;
  }
  speechSynthesis.cancel(); // clear any stuck queue
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.85;
  utter.pitch = 1.0;
  utter.volume = 1.0;
  if (cachedVoices.length > 0) {
    const englishVoice = cachedVoices.find(v => v.lang.startsWith('en')) || cachedVoices[0];
    utter.voice = englishVoice;
  }
  utter.onerror = () => { statusEl.textContent = "Voice playback error — try tapping Begin again."; };
  // Small delay helps mobile Chrome actually fire speech after a tap
  setTimeout(() => speechSynthesis.speak(utter), 50);
}

function showQuote() {
  const q = quotes[Math.floor(Math.random() * quotes.length)];
  quoteEl.style.opacity = 0;
  setTimeout(() => {
    quoteEl.textContent = q.text;
    authorEl.textContent = "— " + q.author;
    quoteEl.style.opacity = 1;
  }, 400);
  chime();
  setTimeout(() => speak(q.text), 600);
}

function updateTimer() {
  const remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  timerEl.textContent = remaining > 0 ? `${m}:${s.toString().padStart(2,'0')} remaining` : '';
  if (remaining <= 0) endSession();
}

function endSession() {
  running = false;
  clearTimeout(quoteTimeout);
  clearInterval(timerInterval);
  stopHum();
  speechSynthesis.cancel();
  statusEl.textContent = "Session complete. Have a magnificent day.";
  timerEl.textContent = "";
  startBtn.textContent = "Begin Again";
  startBtn.disabled = false;
}

function startSession() {
  if (running) return;
  running = true;
  startBtn.disabled = true;
  statusEl.textContent = "Playing for 2 minutes...";
  endTime = Date.now() + 2 * 60 * 1000; // 6:30 to 6:32 = 2 minutes
  startHum();
  showQuote();
  const cycle = () => {
    if (!running) return;
    quoteTimeout = setTimeout(() => {
      if (Date.now() < endTime) {
        showQuote();
        cycle();
      }
    }, 25000); // new quote every 25s
  };
  cycle();
  timerInterval = setInterval(updateTimer, 1000);
}

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startSession();
});
</script>
</body>
</html>
